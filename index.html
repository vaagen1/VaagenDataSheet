/* V27: slider longer - from outer edge under minus to outer edge under plus */
.test{padding-left:8px;padding-right:8px}
.slider{width:100%;box-sizing:border-box;text-align:justify;letter-spacing:1px;font-size:18px;line-height:20px}
.slider:after{content:'';display:inline-block;width:100%}

/* V28: modern slider, almost white at 4mA and blue-gray at 20mA */
.modern-slider{
  width:100%;
  height:22px;
  margin-top:6px;
  appearance:none;
  -webkit-appearance:none;
  background:#dfe9ef;
  border-radius:999px;
  outline:none;
  box-sizing:border-box;
}
.modern-slider::-webkit-slider-thumb{
  appearance:none;
  -webkit-appearance:none;
  width:24px;
  height:24px;
  border-radius:50%;
  background:#7D97AB;
  border:2px solid #ffffff;
  box-shadow:0 1px 4px rgba(0,0,0,.35);
}
.modern-slider::-moz-range-thumb{
  width:24px;
  height:24px;
  border-radius:50%;
  background:#7D97AB;
  border:2px solid #ffffff;
  box-shadow:0 1px 4px rgba(0,0,0,.35);
}

/* V31: text field above slider follows slider color */
.vals{
  border-radius:6px;
  padding:6px 8px;
  margin:0 8px;
  box-sizing:border-box;
  transition:background-color .12s linear;
}

/* V35: move slider slightly down to keep value field visible while adjusting */
.modern-slider{

/* V42: modern compact Location dialog */
.vc-modal-overlay{
  position:fixed;
  inset:0;
  background:rgba(30,40,48,.28);
  display:none;
  align-items:flex-start;
  justify-content:center;
  padding-top:7vh;
  z-index:9999;
  backdrop-filter:blur(2px);
}
.vc-modal-overlay.is-open{display:flex}
.vc-modal-card{
  width:min(340px,calc(100vw - 28px));
  background:#ffffff;
  border:1px solid #d8e4ef;
  border-radius:18px;
  box-shadow:0 14px 40px rgba(0,0,0,.22);
  padding:14px;
  box-sizing:border-box;
  transform:translateY(-8px) scale(.98);
  opacity:0;
  transition:opacity .16s ease, transform .16s ease;
}
.vc-modal-overlay.is-open .vc-modal-card{opacity:1;transform:translateY(0) scale(1)}
.vc-modal-title{font-size:16px;font-weight:700;margin-bottom:3px;color:#26343d}
.vc-modal-sub{font-size:12px;color:#667782;margin-bottom:12px}
.vc-modal-field{
  width:100%;
  border:1px solid #cfdbe5;
  border-radius:12px;
  padding:12px 13px;
  font-size:18px;
  box-sizing:border-box;
  outline:none;
  background:#f8fbfd;
}
.vc-modal-field:focus{border-color:#9bb4c7;box-shadow:0 0 0 3px rgba(125,151,171,.18);background:#fff}
.vc-modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}
.vc-modal-btn{border:none;border-radius:10px;padding:10px 14px;font-size:13px}
.vc-modal-cancel{background:#edf2f5;color:#33424c}
.vc-modal-ok{background:#7D97AB;color:#fff}
.loc-select.flash-new{
  animation:vcSettleIntoPlace 1.15s cubic-bezier(.22,.8,.25,1);
  transform-origin:center;
}
@keyframes vcSettleIntoPlace{
  0%{
    transform:translateY(-10px) scale(1.035);
    background:#edf6fb;
    box-shadow:0 10px 22px rgba(125,151,171,.28),0 0 0 0 rgba(125,151,171,.35);
  }
  45%{
    transform:translateY(2px) scale(1.01);
    background:#f8fbfd;
    box-shadow:0 4px 12px rgba(125,151,171,.18),0 0 0 7px rgba(125,151,171,.12);
  }
  100%{
    transform:translateY(0) scale(1);
    background:#ffffff;
    box-shadow:0 0 0 0 rgba(125,151,171,0),0 0 0 0 rgba(125,151,171,0);
  }
}

<script>
(function(){
  const slider = document.querySelector('.modern-slider');
  if(!slider) return;

  function mix(a, b, t){ return Math.round(a + (b-a)*t); }
  function colorAt(t){
    // 4mA = almost white, 20mA = light frame-like blue-gray (#d8e4ef)
    const r = mix(248, 216, t);
    const g = mix(251, 228, t);
    const b = mix(253, 239, t);
    return `rgb(${r},${g},${b})`;
  }

  function updateSliderColor(){
    const min = parseFloat(slider.min || 4);
    const max = parseFloat(slider.max || 20);
    const val = parseFloat(slider.value || min);
    const t = Math.max(0, Math.min(1, (val - min) / (max - min)));
    const c = colorAt(t);
    slider.style.background = c;
    const vals = document.querySelector('.vals');
    if(vals) vals.style.backgroundColor = c;
  }

  slider.addEventListener('input', updateSliderColor);
  slider.addEventListener('change', updateSliderColor);
  updateSliderColor();
})();
</script>


<script>
(function(){
  const slider = document.querySelector('.modern-slider');
  const minusBtn = document.querySelector('.testrow .tbtn:first-child');
  const plusBtn = document.querySelector('.testrow .tbtn:last-child');
  const vals = document.querySelector('.vals');
  if(!slider || !minusBtn || !plusBtn) return;

  // Make each button press visible. Slider still has fine internal resolution.
  slider.step = '0.1';

  let repeatTimer = null;
  let repeatDelay = null;

  function formatNo(v){
    return Number(v).toFixed(2).replace('.', ',');
  }

  function parseNo(value){
    if(value === null || value === undefined) return NaN;
    return parseFloat(String(value).replace(/\s/g,'').replace(',', '.'));
  }

  function updateText(){
    const mA = parseFloat(slider.value || 12);
    const leftPanel = document.querySelector('.align-left-panel');
    const lrvInput = leftPanel ? leftPanel.querySelector('.lrv-block input') : null;
    const raInput = leftPanel ? leftPanel.querySelector('.ra-block input') : null;
    const lrv = lrvInput ? parseNo(lrvInput.value) : NaN;
    const ra = raInput ? parseNo(raInput.value) : NaN;
    const pv = (Number.isFinite(lrv) && Number.isFinite(ra)) ? lrv + ((mA - 4) / 16) * ra : NaN;
    if(vals) vals.textContent = formatNo(pv) + ' °C   ' + formatNo(mA) + ' mA';
  }

  function move(direction){
    const min = parseFloat(slider.min || 4);
    const max = parseFloat(slider.max || 20);
    const step = parseFloat(slider.step || 0.1);
    let value = parseFloat(slider.value || min);
    value = Math.max(min, Math.min(max, value + direction * step));
    slider.value = value.toFixed(2);
    slider.dispatchEvent(new Event('input', {bubbles:true}));
    updateText();
  }

  function stop(){
    if(repeatDelay){ clearTimeout(repeatDelay); repeatDelay = null; }
    if(repeatTimer){ clearInterval(repeatTimer); repeatTimer = null; }
  }

  function start(direction){
    stop();
    move(direction); // one step immediately
    repeatDelay = setTimeout(function(){
      repeatTimer = setInterval(function(){ move(direction); }, 80);
    }, 300);
  }

  function bind(btn, direction){
    btn.style.touchAction = 'none';
    btn.addEventListener('pointerdown', function(e){
      e.preventDefault();
      start(direction);
    });
  }

  bind(minusBtn, -1);
  bind(plusBtn, 1);

  document.addEventListener('pointerup', stop);
  document.addEventListener('pointercancel', stop);
  document.addEventListener('pointerleave', stop);

  slider.addEventListener('input', updateText);
  updateText();
})();
</script>

<script>
(function(){

  const lrvInput = leftPanel.querySelector('.lrv-block input');
  const urvInput = leftPanel.querySelector('.urv-block input');
  const raInput = leftPanel.querySelector('.ra-block input');
  if(!lrvInput || !urvInput || !raInput) return;

  function parseNo(value){
    if(value === null || value === undefined) return NaN;
    return parseFloat(String(value).replace(/\s/g,'').replace(',', '.'));
  }

  function formatNo(value){
    if(!Number.isFinite(value)) return '';
    return value.toFixed(2).replace('.', ',');
  }

  function updateRA(){
    const lrv = parseNo(lrvInput.value);
    const urv = parseNo(urvInput.value);
    const ra = urv - lrv;
    raInput.value = formatNo(ra);
  }

  lrvInput.addEventListener('input', updateRA);
  urvInput.addEventListener('input', updateRA);
  lrvInput.addEventListener('change', updateRA);
  urvInput.addEventListener('change', updateRA);
  updateRA();
})();
</script>

<script>
(function(){
  const leftPanel = document.querySelector('.align-left-panel');
  const calTable = document.querySelector('.cal table');
  if(!leftPanel || !calTable) return;

  const unitBox = leftPanel.querySelector('.unit-labelbox');

  const urvInput = leftPanel.querySelector('.urv-block input');
  const raInput = leftPanel.querySelector('.ra-block input');
  const rows = calTable.querySelectorAll('tr');
  const valueRow = rows[2];
  if(!lrvInput || !urvInput || !raInput || !valueRow) return;

  function parseNo(value){
    if(value === null || value === undefined) return NaN;
    return parseFloat(String(value).replace(/\s/g,'').replace(',', '.'));
  }

  function formatNo(value){
    if(!Number.isFinite(value)) return '';
    return value.toFixed(2).replace('.', ',');
  }

  function updateGreenLastRow(){
    const unit = unitBox && (unitBox.value !== undefined ? unitBox.value : unitBox.textContent).trim() ? (unitBox.value !== undefined ? unitBox.value : unitBox.textContent).trim() : 'Unit';
    const lrv = parseNo(lrvInput.value);
    const ra = parseNo(raInput.value);
    const cells = valueRow.querySelectorAll('td');
    const percents = [0, 0.25, 0.50, 0.75, 1.00];

    cells[0].textContent = unit;

      cells[i+1].textContent = formatNo(lrv + percents[i] * ra);
    }
  }

  lrvInput.addEventListener('input', function(){ setTimeout(updateGreenLastRow, 0); });
  urvInput.addEventListener('input', function(){ setTimeout(updateGreenLastRow, 0); });
  lrvInput.addEventListener('change', function(){ setTimeout(updateGreenLastRow, 0); });
  urvInput.addEventListener('change', function(){ setTimeout(updateGreenLastRow, 0); });

})();

<script>
(function(){
  const leftPanel = document.querySelector('.align-left-panel');
  const triggerTable = document.querySelector('.tt');
  if(!leftPanel || !triggerTable) return;

  const lrvInput = leftPanel.querySelector('.lrv-block input');
  const raInput = leftPanel.querySelector('.ra-block input');
  if(!lrvInput || !raInput) return;

  function parseNo(value){
    if(value === null || value === undefined) return NaN;
    return parseFloat(String(value).replace(/\s/g,'').replace(',', '.'));
  }

  function formatNo(value){
    if(!Number.isFinite(value)) return '';
    return value.toFixed(2).replace('.', ',');
  }

  function updateTriggerMA(){
    const lrv = parseNo(lrvInput.value);
    const ra = parseNo(raInput.value);
    const rows = triggerTable.querySelectorAll('tr');
    rows.forEach(function(row){
      const valueInput = row.querySelector('td.val input');
      const maCell = row.querySelector('td.ma');
      if(!valueInput || !maCell) return;
      const rawPv = String(valueInput.value || '').trim();
      if(rawPv === ''){
        maCell.textContent = '';
        return;
      }
      const pv = parseNo(rawPv);
      const ma = (Number.isFinite(pv) && Number.isFinite(lrv) && Number.isFinite(ra) && ra !== 0)
        ? 4 + ((pv - lrv) / ra) * 16
        : NaN;
      maCell.textContent = Number.isFinite(ma) ? formatNo(ma) + ' mA' : '';
    });
  }

  triggerTable.querySelectorAll('td.val input').forEach(function(input){
    input.addEventListener('input', updateTriggerMA);
    input.addEventListener('change', updateTriggerMA);
  });

  lrvInput.addEventListener('input', function(){ setTimeout(updateTriggerMA, 0); });
  lrvInput.addEventListener('change', function(){ setTimeout(updateTriggerMA, 0); });

  const urvInput = leftPanel.querySelector('.urv-block input');
  if(urvInput){
    urvInput.addEventListener('input', function(){ setTimeout(updateTriggerMA, 0); });
    urvInput.addEventListener('change', function(){ setTimeout(updateTriggerMA, 0); });
  }

  updateTriggerMA();
})();
</script>

<script>
(function(){
  const addBtn = document.querySelector('.loc-add-btn');
  const select = document.querySelector('.loc-select');
  const modal = document.getElementById('locAddModal');
  const input = document.getElementById('locAddInput');
  const okBtn = document.getElementById('locAddOk');
  const cancelBtn = document.getElementById('locAddCancel');
  const message = document.getElementById('locAddMessage');
  if(!addBtn || !select || !modal || !input || !okBtn || !cancelBtn) return;

  function openModal(){
    input.value = '';
    if(message) message.textContent = '';
    input.classList.remove('duplicate-stop');
    modal.classList.add('is-open');
    modal.setAttribute('aria-hidden','false');
    setTimeout(function(){ input.focus(); }, 180);
  }

  function closeModal(){
    modal.classList.remove('is-open');
    modal.setAttribute('aria-hidden','true');
    addBtn.focus();
  }

  function clearValuesBelowLocation(){
    const tagInput = document.querySelector('.tag-row .toptag');
    const desInput = document.querySelector('.des-row input');
    const unitBox = document.querySelector('.unit-labelbox');
    const lrvInput = document.querySelector('.lrv-block input');
    const urvInput = document.querySelector('.urv-block input');
    const raInput = document.querySelector('.ra-block input');
    const sliderText = document.querySelector('.vals');
    const calLastRow = document.querySelector('.cal table tr:last-child');

    if(tagInput) tagInput.value = '';
    if(desInput) desInput.value = '';
    if(unitBox) if(unitBox.value !== undefined){ unitBox.value = ''; } else { unitBox.textContent = ''; }
    if(lrvInput) lrvInput.value = '';
    if(urvInput) urvInput.value = '';
    if(raInput) raInput.value = '';
    if(sliderText) sliderText.textContent = '';

    document.querySelectorAll('.tt td.val input').forEach(function(inp){ inp.value = ''; });
    document.querySelectorAll('.tt td.ma').forEach(function(cell){ cell.textContent = ''; });

    if(calLastRow){
      const cells = calLastRow.querySelectorAll('td');
      const unitText = unitBox && (unitBox.value !== undefined ? unitBox.value : unitBox.textContent).trim() ? (unitBox.value !== undefined ? unitBox.value : unitBox.textContent).trim() : 'Unit';
      cells.forEach(function(cell, index){
        cell.textContent = index === 0 ? unitText : '';
      });
    }
  }

  function addLocation(){
    const name = input.value.trim();
    if(!name){ closeModal(); return; }
    let existing = null;
    Array.from(select.options).forEach(function(opt){
      if(opt.text.trim().toLowerCase() === name.toLowerCase()) existing = opt;
    });
    if(existing){
      if(message) message.textContent = 'Location finnes fra før';
      input.classList.remove('duplicate-stop');
      void input.offsetWidth;
      input.classList.add('duplicate-stop');
      input.focus();
      return;
    } else {
      const opt = document.createElement('option');
      opt.textContent = name;
      opt.value = name;
      select.appendChild(opt);
      select.value = name;
    }
    clearValuesBelowLocation();
    select.classList.remove('flash-new');
    void select.offsetWidth;
    select.classList.add('flash-new');
    setTimeout(closeModal, 120);
  }

  addBtn.addEventListener('click', openModal);
  cancelBtn.addEventListener('click', closeModal);
  okBtn.addEventListener('click', addLocation);
  input.addEventListener('input', function(){ if(message) message.textContent = ''; input.classList.remove('duplicate-stop'); });
  input.addEventListener('keydown', function(e){
    if(e.key === 'Enter') addLocation();
    if(e.key === 'Escape') closeModal();
  });
  modal.addEventListener('click', function(e){
    if(e.target === modal) closeModal();
  });
})();
</script>

<script>
(function(){
  const editBtn = document.querySelector('.loc-edit-btn');
  const select = document.querySelector('.loc-select');
  const modal = document.getElementById('locEditModal');
  const input = document.getElementById('locEditInput');
  const okBtn = document.getElementById('locEditOk');
  const cancelBtn = document.getElementById('locEditCancel');
  const message = document.getElementById('locEditMessage');
  if(!editBtn || !select || !modal || !input || !okBtn || !cancelBtn) return;

  function currentOption(){
    return select.options[select.selectedIndex] || null;
  }

  function openModal(){
    const opt = currentOption();
    input.value = opt ? opt.text.trim() : '';
    if(message) message.textContent = '';
    input.classList.remove('duplicate-stop');
    modal.classList.add('is-open');
    modal.setAttribute('aria-hidden','false');
    setTimeout(function(){ input.focus(); input.select(); }, 180);
  }

  function closeModal(){
    modal.classList.remove('is-open');
    modal.setAttribute('aria-hidden','true');
    editBtn.focus();
  }

  function saveLocationText(){
    const opt = currentOption();
    if(!opt){ closeModal(); return; }
    const oldName = opt.text.trim();
    const newName = input.value.trim();
    if(!newName){ closeModal(); return; }

    let duplicate = null;
    Array.from(select.options).forEach(function(other){
      if(other !== opt && other.text.trim().toLowerCase() === newName.toLowerCase()) duplicate = other;
    });
    if(duplicate){
      if(message) message.textContent = 'Location finnes fra før';
      input.classList.remove('duplicate-stop');
      void input.offsetWidth;
      input.classList.add('duplicate-stop');
      input.focus();
      return;
    }

    opt.textContent = newName;
    opt.value = newName;
    select.value = newName;
    select.classList.remove('flash-new');
    void select.offsetWidth;
    select.classList.add('flash-new');
    setTimeout(closeModal, 120);
  }

  editBtn.addEventListener('click', openModal);
  cancelBtn.addEventListener('click', closeModal);
  okBtn.addEventListener('click', saveLocationText);
  input.addEventListener('input', function(){ if(message) message.textContent = ''; input.classList.remove('duplicate-stop'); });
  input.addEventListener('keydown', function(e){
    if(e.key === 'Enter') saveLocationText();
    if(e.key === 'Escape') closeModal();
  });
  modal.addEventListener('click', function(e){
    if(e.target === modal) closeModal();
  });
})();
</script>

          <label for='tagAddLL'>LL</label><input class='tag-alarm-check' id='tagAddLLCheck' type='checkbox'><input class='tag-form-input tag-alarm-value' id='tagAddLL' type='text' inputmode='decimal' autocomplete='off' disabled>
        </div>
      </div>
    </div>

    <div class='tag-modal-message' id='tagAddMessage'></div>
  </div>
</div>
<script>
(function(){
  const addBtn = document.querySelector('.tag-add-btn');
  const modal = document.getElementById('tagAddModal');
  const okBtn = document.getElementById('tagAddOk');
  const cancelBtn = document.getElementById('tagAddCancel');
  const message = document.getElementById('tagAddMessage');
  const fields = {
    tag: document.getElementById('tagAddTag'),
    des: document.getElementById('tagAddDes'),
    unit: document.getElementById('tagAddUnit'),
    lrv: document.getElementById('tagAddLRV'),
    urv: document.getElementById('tagAddURV'),
    h: document.getElementById('tagAddH'),
    hh: document.getElementById('tagAddHH'),
    l: document.getElementById('tagAddL'),
    ll: document.getElementById('tagAddLL')
  };
  if(!addBtn || !modal || !okBtn || !cancelBtn) return;

  function openModal(){
    Object.keys(fields).forEach(function(k){ if(fields[k]) fields[k].value = ''; });
    if(message) message.textContent = '';
    modal.classList.add('is-open');
    modal.setAttribute('aria-hidden','false');
    setTimeout(function(){ if(fields.tag) fields.tag.focus(); }, 30);
  }
  function closeModal(){
    modal.classList.remove('is-open');
    modal.setAttribute('aria-hidden','true');
  }
  function setValue(el, value){
    if(!el) return;
    el.value = value || '';
    el.dispatchEvent(new Event('input', {bubbles:true}));
    el.dispatchEvent(new Event('change', {bubbles:true}));
  }
  function saveTag(){
    const tag = (fields.tag && fields.tag.value ? fields.tag.value.trim() : '');
    if(!tag){
      if(message) message.textContent = 'Tag is required';
      if(fields.tag) fields.tag.focus();
      return;
    }

    setValue(document.querySelector('.tag-row .toptag'), tag);
    setValue(document.querySelector('.des-row input'), fields.des.value);
    setValue(document.querySelector('.unit-input'), fields.unit.value);
    setValue(document.querySelector('.lrv-block input'), fields.lrv.value);
    setValue(document.querySelector('.urv-block input'), fields.urv.value);

    const alarmInputs = document.querySelectorAll('.tt td.val input');
    setValue(alarmInputs[0], fields.h.value);
    setValue(alarmInputs[1], fields.hh.value);
    setValue(alarmInputs[2], fields.l.value);
    setValue(alarmInputs[3], fields.ll.value);

    closeModal();
  }

  addBtn.addEventListener('click', openModal);
  cancelBtn.addEventListener('click', closeModal);
  okBtn.addEventListener('click', saveTag);
  modal.addEventListener('pointerup', function(e){ if(e.target === modal) closeModal(); });
  Object.keys(fields).forEach(function(k){
    if(fields[k]) fields[k].addEventListener('keydown', function(e){
      if(e.key === 'Enter') saveTag();
      if(e.key === 'Escape') closeModal();
    });
  });
})();
</script>

<script>
(function(){
  const pairs = [
    ['tagAddHCheck','tagAddH'],
    ['tagAddHHCheck','tagAddHH'],
    ['tagAddLCheck','tagAddL'],
    ['tagAddLLCheck','tagAddLL']
  ];
  pairs.forEach(function(pair){
    const check = document.getElementById(pair[0]);
    const input = document.getElementById(pair[1]);
    if(!check || !input) return;
    function syncAlarmInput(){
      input.disabled = !check.checked;
      input.classList.toggle('alarm-enabled', check.checked);
      if(!check.checked){ input.value = ''; }
      if(check.checked){ input.focus(); }
    }
    check.addEventListener('change', syncAlarmInput);
    syncAlarmInput();
  });
})();
</script>

<script>
(function(){
  function parseNo(value){
    if(value === null || value === undefined) return NaN;
    return parseFloat(String(value).replace(/\s/g,'').replace(',', '.'));
  }
  function formatNo(value){
    if(!Number.isFinite(value)) return '';
    return value.toFixed(2).replace('.', ',');
  }
  function recalcMainTriggerMA(){
    const lrvInput = document.querySelector('.lrv-block input');
    const raInput = document.querySelector('.ra-block input');
    const triggerTable = document.querySelector('.tt');
    if(!lrvInput || !raInput || !triggerTable) return;

    const lrv = parseNo(lrvInput.value);
    const ra = parseNo(raInput.value);

    triggerTable.querySelectorAll('tr').forEach(function(row){
      const valueInput = row.querySelector('td.val input');
      const maCell = row.querySelector('td.ma');
      if(!valueInput || !maCell) return;

      const rawPv = String(valueInput.value || '').trim();
      if(rawPv === ''){
        maCell.textContent = '';
        return;
      }

      const pv = parseNo(rawPv);
      const ma = (Number.isFinite(pv) && Number.isFinite(lrv) && Number.isFinite(ra) && ra !== 0)
        ? 4 + ((pv - lrv) / ra) * 16
        : NaN;
      maCell.textContent = Number.isFinite(ma) ? formatNo(ma) + ' mA' : '';
    });
  }

  // Main table direct edits
  document.addEventListener('input', function(e){
    if(e.target && e.target.matches('.tt td.val input, .lrv-block input, .urv-block input')){
      setTimeout(recalcMainTriggerMA, 0);
      setTimeout(recalcMainTriggerMA, 20);
    }
  });
  document.addEventListener('change', function(e){
    if(e.target && e.target.matches('.tt td.val input, .lrv-block input, .urv-block input')){
      setTimeout(recalcMainTriggerMA, 0);
      setTimeout(recalcMainTriggerMA, 20);
    }
  });

  // Tag+ writes several values programmatically. Run one final pass after Save closes the form.
  const tagSaveBtn = document.getElementById('tagAddOk');
  if(tagSaveBtn){
    tagSaveBtn.addEventListener('click', function(){
      setTimeout(recalcMainTriggerMA, 0);
      setTimeout(recalcMainTriggerMA, 30);
      setTimeout(recalcMainTriggerMA, 100);
    });
  }
})();
</script>

<script>
(function(){
  const editBtn = document.querySelector('.tag-edit-btn');
  const addBtn = document.querySelector('.tag-add-btn');
  const modal = document.getElementById('tagAddModal');
  if(!editBtn || !addBtn || !modal) return;

  function setField(id, value){
    const el = document.getElementById(id);
    if(!el) return;
    el.value = value || '';
    el.dispatchEvent(new Event('input', {bubbles:true}));
    el.dispatchEvent(new Event('change', {bubbles:true}));
  }

  function setAlarm(checkId, inputId, value){
    const check = document.getElementById(checkId);
    const input = document.getElementById(inputId);
    if(!check || !input) return;
    const hasValue = String(value || '').trim() !== '';
    check.checked = hasValue;
    check.dispatchEvent(new Event('change', {bubbles:true}));
    if(hasValue){
      input.value = value;
      input.disabled = false;
      input.classList.add('alarm-enabled');
      input.dispatchEvent(new Event('input', {bubbles:true}));
      input.dispatchEvent(new Event('change', {bubbles:true}));
    }
  }

  function readMainForm(){
    const alarmInputs = document.querySelectorAll('.tt td.val input');
    return {
      tag: (document.querySelector('.tag-row .toptag') || {}).value || '',
      des: (document.querySelector('.des-row input') || {}).value || '',
      unit: (document.querySelector('.unit-input') || {}).value || '',
      lrv: (document.querySelector('.lrv-block input') || {}).value || '',
      urv: (document.querySelector('.urv-block input') || {}).value || '',
      h: alarmInputs[0] ? alarmInputs[0].value : '',
      hh: alarmInputs[1] ? alarmInputs[1].value : '',
      l: alarmInputs[2] ? alarmInputs[2].value : '',
      ll: alarmInputs[3] ? alarmInputs[3].value : ''
    };
  }

  function fillEditForm(data){
    const title = document.getElementById('tagAddTitle');
    if(title) title.textContent = 'Edit tag';

    setField('tagAddTag', data.tag);
    setField('tagAddDes', data.des);
    setField('tagAddUnit', data.unit);
    setField('tagAddLRV', data.lrv);
    setField('tagAddURV', data.urv);

    setAlarm('tagAddHCheck', 'tagAddH', data.h);
    setAlarm('tagAddHHCheck', 'tagAddHH', data.hh);
    setAlarm('tagAddLCheck', 'tagAddL', data.l);
    setAlarm('tagAddLLCheck', 'tagAddLL', data.ll);
  }

  editBtn.addEventListener('click', function(){
    const data = readMainForm();
    addBtn.click();
    setTimeout(function(){ fillEditForm(data); }, 20);
    setTimeout(function(){ fillEditForm(data); }, 80);
  });

  // Keep New tag title when using + button.
  addBtn.addEventListener('click', function(){
    setTimeout(function(){
      const title = document.getElementById('tagAddTitle');
      if(title && !modal.classList.contains('edit-mode')) title.textContent = 'New tag';
    }, 0);
  });
})();
</script>

<script>
(function(){
  const modal = document.getElementById('tagAddModal');
  const cancelBtn = document.getElementById('tagAddCancel');
  const addBtn = document.querySelector('.tag-add-btn');
  const editBtn = document.querySelector('.tag-edit-btn');
  const title = document.getElementById('tagAddTitle');
  if(!modal) return;

  function resetTagFormState(){
    modal.classList.remove('tag-edit-mode');
    if(title) title.textContent = 'New tag';
  }

  // New Tag mode: blank form/new title.
  if(addBtn){
    addBtn.addEventListener('click', function(){
      setTimeout(function(){
        modal.classList.remove('tag-edit-mode');
        if(title) title.textContent = 'New tag';
      }, 5);
    });
  }

  // Edit mode: title stays as Edit tag after prefill script has loaded values.
  if(editBtn){
    editBtn.addEventListener('click', function(){
      setTimeout(function(){
        modal.classList.add('tag-edit-mode');
        if(title) title.textContent = 'Edit tag';
      }, 100);
    });
  }

  // Cancel is explicitly local only: close/reset form title/state, do not write values anywhere.
  if(cancelBtn){
    cancelBtn.addEventListener('click', function(){
      setTimeout(resetTagFormState, 20);
    });
  }

  // Overlay close also resets state only.
  modal.addEventListener('pointerup', function(e){
    if(e.target === modal){
      setTimeout(resetTagFormState, 20);
    }
  });
})();
</script>
